<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hacker Hangout</title>
<style>
body {
  margin:0;
  font-family:'Courier New', monospace;
  background:black;
  color:#0f0;
  overflow:hidden;
}
canvas#matrix {
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}
#chat-container {
  display:flex;
  flex-direction:column;
  height:100vh;
  max-width:600px;
  margin:auto;
  padding:10px;
  box-sizing:border-box;
  background:rgba(0,0,0,0.7);
  overflow:hidden;
}
h1#banner {
  text-align:center;
  color:#0f0;
  font-size:2rem;
  margin-bottom:10px;
  text-shadow:0 0 5px #0f0,0 0 10px #0f0;
}
#chat {
  flex:1;
  overflow-y:auto;
  padding:5px;
  display:flex;
  flex-direction:column;
}
.msg {
  padding:5px 10px;
  margin:5px 0;
  border-radius:5px;
  display:inline-block;
  max-width:80%;
  word-wrap:break-word;
}
.msg.me { background:rgba(0,255,0,0.2); align-self:flex-end; color:#0f0; }
.msg.other { background:rgba(0,255,255,0.2); align-self:flex-start; color:#0ff; }
.msg.admin { background:rgba(255,0,0,0.3); color:#f00; font-weight:bold; }
.msg.banned { background:red; color:#fff; animation: flash 0.3s infinite; }
@keyframes flash {0%,100%{opacity:1;}50%{opacity:0.3;}}
#input-container { display:flex; margin-top:5px; gap:5px; }
#username,#message { flex:1; padding:5px; font-family: monospace; background:#000; color:#0f0; border:1px solid #0f0; }
#send { padding:5px 15px; background:#0f0; color:#000; border:none; cursor:pointer; font-family: monospace; font-weight:bold; }
#send:hover { background:#0d0; }
#admin-panel { display:none; background:rgba(255,0,0,0.3); padding:10px; margin-top:5px; border-radius:5px; }
#admin-panel h3 { margin-top:0; color:#f00; }
#admin-panel input, #admin-panel button { margin:2px; padding:5px; font-family: monospace; }
#admin-panel button { background:#f00; color:#fff; border:none; cursor:pointer; }
#wtfBtn { background:#ff0; color:#000; font-weight:bold; font-size:16px; padding:10px; margin-top:10px; width:100%; cursor:pointer; }
#rickrollBtn { background:#ff1493; color:#fff; font-weight:bold; font-size:16px; padding:10px; margin-top:5px; width:100%; cursor:pointer; }
#admin-login { margin-top:10px; padding:10px; background:rgba(0,255,0,0.1); border-radius:5px; }
#admin-login input { margin:2px; padding:5px; background:#000; color:#0f0; border:1px solid #0f0; font-family: monospace; }
#adminLoginBtn { padding:5px 10px; background:#0f0; color:#000; border:none; cursor:pointer; font-family: monospace; font-weight:bold; margin-left:5px; }
#bannedList { color:#f00; }

html.shake {
  animation: fullScreenShake 0.5s infinite;
}
@keyframes fullScreenShake {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  10% { transform: translate(-15px, -15px) rotate(-3deg); }
  20% { transform: translate(15px, 15px) rotate(3deg); }
  30% { transform: translate(-15px, 15px) rotate(-2deg); }
  40% { transform: translate(15px, -15px) rotate(2deg); }
  50% { transform: translate(-15px, -15px) rotate(-3deg); }
  60% { transform: translate(15px, 15px) rotate(3deg); }
  70% { transform: translate(-15px, 15px) rotate(-2deg); }
  80% { transform: translate(15px, -15px) rotate(2deg); }
  90% { transform: translate(-15px, -15px) rotate(-3deg); }
}

#fakeFullscreen {
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  background:rgba(0,0,0,0.98);
  display:none;
  z-index:999999;
  justify-content:center;
  align-items:center;
  cursor:none;
}
#fakeFullscreen.active {
  display:flex;
}

#nukeOverlay {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:none;
  z-index:1;
  justify-content:center;
  align-items:center;
}
#nukeOverlay.active {
  display:flex;
}
#nukeGif {
  width:100%;
  height:100%;
  object-fit:cover;
  border:none;
}

#rickrollOverlay {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
  display:none;
  z-index:1;
  justify-content:center;
  align-items:center;
}
#rickrollOverlay.active {
  display:flex;
}
#rickrollGif {
  width:100%;
  height:100%;
  object-fit:cover;
  border:none;
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div id="fakeFullscreen">
  <div id="nukeOverlay">
    <img id="nukeGif" src="https://media.giphy.com/media/HhTXt43pk1I1W/giphy.gif" alt="NUKE">
  </div>
  <div id="rickrollOverlay">
    <img id="rickrollGif" src="https://media.giphy.com/media/Vuw9m5wXviFIQ/giphy.gif" alt="RICKROLL">
  </div>
</div>

<div id="chat-container">
  <h1 id="banner">Hacker Hangout</h1>
  <div id="chat"></div>
  <div id="input-container">
    <input id="username" placeholder="Your username">
    <input id="message" placeholder="Your message">
    <button id="send">Send</button>
  </div>

  <div id="admin-panel">
    <h3>Admin Panel</h3>
    <input id="banUser" placeholder="Username to ban">
    <button id="banBtn">Ban</button>
    <input id="unbanUser" placeholder="Username to unban">
    <button id="unbanBtn">Unban</button>
    <button id="clearBtn">Clear Chat</button>
    <button id="wtfBtn">🚨 WTF MODE 🚨</button>
    <button id="rickrollBtn">🎵 RICKROLL MODE 🎵</button>
  </div>

  <div id="admin-login">
    <input id="adminUser" placeholder="Admin username">
    <input id="adminPass" type="password" placeholder="Admin password">
    <button id="adminLoginBtn">Login as Admin</button>
  </div>

  <div style="margin-top:10px; color:#f00;">Banned users: <span id="bannedList">(none)</span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.2.1/firebase-database-compat.js"></script>

<script>

  authDomain: "hacker-hangout-gam3r999.firebaseapp.com",
  databaseURL: "https://hacker-hangout-gam3r999-default-rtdb.firebaseio.com",
  projectId: "hacker-hangout-gam3r999",
  storageBucket: "hacker-hangout-gam3r999.firebasestorage.app",
  messagingSenderId: "411445080851",
  appId: "1:411445080851:web:f0c3b87f8f6ec4cf4ea0e6",

<script>
(function(){
  const chatEl=document.getElementById('chat');
  const userEl=document.getElementById('username');
  const msgEl=document.getElementById('message');
  const sendBtn=document.getElementById('send');
  const adminUserEl=document.getElementById('adminUser');
  const adminPassEl=document.getElementById('adminPass');
  const adminLoginBtn=document.getElementById('adminLoginBtn');
  const adminPanel=document.getElementById('admin-panel');
  const banUserEl=document.getElementById('banUser');
  const unbanUserEl=document.getElementById('unbanUser');
  const banBtn=document.getElementById('banBtn');
  const unbanBtn=document.getElementById('unbanBtn');
  const clearBtn=document.getElementById('clearBtn');
  const bannedListEl=document.getElementById('bannedList');
  const wtfBtn=document.getElementById('wtfBtn');
  const rickrollBtn=document.getElementById('rickrollBtn');
  const fakeFullscreen=document.getElementById('fakeFullscreen');
  const nukeOverlay=document.getElementById('nukeOverlay');
  const rickrollOverlay=document.getElementById('rickrollOverlay');
  const htmlElement=document.documentElement;

  const DEFAULT_ADMINS={ "adminsonlylol":"thisadminwilleventuallybeabused" };
  let admins={...DEFAULT_ADMINS};
  let bannedUsers={};
  let chaosModeLocked = false;
  let pointerLockInterval = null;

  let deviceId=localStorage.getItem('hh_device_id');
  if(!deviceId){
    deviceId=Date.now().toString(36)+Math.random().toString(36).slice(2,8); 
    localStorage.setItem('hh_device_id',deviceId);
  }

  const db=firebase.database();
  const messagesRef=db.ref('messages');
  const bannedRef=db.ref('banned');
  const devicesRef=db.ref('devices');
  const wtfModeRef=db.ref('wtfMode');
  const rickrollModeRef=db.ref('rickrollMode');

  function lockPointer() {
    if (!chaosModeLocked) return;
    const elem = fakeFullscreen;
    if (elem.requestPointerLock) {
      elem.requestPointerLock();
    } else if (elem.mozRequestPointerLock) {
      elem.mozRequestPointerLock();
    } else if (elem.webkitRequestPointerLock) {
      elem.webkitRequestPointerLock();
    }
  }

  function unlockPointer() {
    if (document.exitPointerLock) {
      document.exitPointerLock();
    } else if (document.mozExitPointerLock) {
      document.mozExitPointerLock();
    } else if (document.webkitExitPointerLock) {
      document.webkitExitPointerLock();
    }
  }

  function maintainPointerLock() {
    pointerLockInterval = setInterval(() => {
      if (chaosModeLocked && !document.pointerLockElement && !document.mozPointerLockElement && !document.webkitPointerLockElement) {
        lockPointer();
      }
    }, 100);
  }

  function enterFullscreen() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
      elem.requestFullscreen().catch(err => {});
    } else if (elem.webkitRequestFullscreen) {
      elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) {
      elem.msRequestFullscreen();
    } else if (elem.mozRequestFullScreen) {
      elem.mozRequestFullScreen();
    }
  }

  function exitFullscreen() {
    if (document.exitFullscreen) {
      document.exitFullscreen().catch(err => {});
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    } else if (document.msExitFullscreen) {
      document.msExitFullscreen();
    } else if (document.mozCancelFullScreen) {
      document.mozCancelFullScreen();
    }
  }

  function blockEscape(e) {
    if (chaosModeLocked) {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      return false;
    }
  }

  function startChaosTrap() {
    chaosModeLocked = true;
    fakeFullscreen.classList.add('active');
    
    enterFullscreen();
    
    setTimeout(() => {
      lockPointer();
      maintainPointerLock();
    }, 100);
    
    document.addEventListener('keydown', blockEscape, true);
    document.addEventListener('keyup', blockEscape, true);
    document.addEventListener('keypress', blockEscape, true);
    document.addEventListener('contextmenu', blockEscape, true);
  }

  function stopChaosTrap() {
    chaosModeLocked = false;
    fakeFullscreen.classList.remove('active');
    
    exitFullscreen();
    unlockPointer();
    
    if (pointerLockInterval) {
      clearInterval(pointerLockInterval);
      pointerLockInterval = null;
    }
    
    document.removeEventListener('keydown', blockEscape, true);
    document.removeEventListener('keyup', blockEscape, true);
    document.removeEventListener('keypress', blockEscape, true);
    document.removeEventListener('contextmenu', blockEscape, true);
  }

  fakeFullscreen.addEventListener('click', () => {
    if (chaosModeLocked) {
      lockPointer();
    }
  });

  function escapeHtml(str){ 
    return String(str).replace(/[&<>"']/g,s=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[s])); 
  }

  function renderMessages(arr){
    chatEl.innerHTML='';
    arr.forEach(m=>{
      if(bannedUsers[m.username]) return;
      const div=document.createElement('div');
      const currentUser = userEl.value.trim() || 'Anonymous';
      div.className='msg '+((m.username===currentUser)?'me':'other');
      if(admins[m.username]) div.classList.add('admin');
      div.innerHTML=`<strong>${escapeHtml(m.username)}</strong>: ${escapeHtml(m.text)}`;
      chatEl.appendChild(div);
    });
    chatEl.scrollTop=chatEl.scrollHeight;
  }

  function flashBanned(username,text){
    const div=document.createElement('div');
    div.className='msg banned';
    div.innerHTML=`<strong>${escapeHtml(username)}</strong>: ${escapeHtml(text)}`;
    chatEl.appendChild(div);
    chatEl.scrollTop=chatEl.scrollHeight;
    setTimeout(()=>div.remove(),2000);
  }

  function sendMessage(){
    const username=(userEl.value||'Anonymous').trim();
    const text=(msgEl.value||'').trim();
    if(!text) return;
    if(bannedUsers[username]){ 
      flashBanned(username,text); 
      msgEl.value=''; 
      return;
    }
    devicesRef.child(username+'_'+deviceId).set({ timestamp:Date.now() });
    messagesRef.push({ username,text,timestamp:Date.now(),deviceId });
    msgEl.value='';
  }

  function loginAdmin(){
    const u=(adminUserEl.value||'').trim();
    const p=(adminPassEl.value||'').trim();
    if(!u||!p) return;
    if(admins[u]&&admins[u]===p){ 
      adminPanel.style.display='block';
      sessionStorage.setItem('hh_admin_user',u);
    }
    adminUserEl.value=''; 
    adminPassEl.value='';
  }

  function updateBannedListUI(){
    const banned = Object.keys(bannedUsers);
    bannedListEl.textContent=banned.length ? banned.join(', ') : '(none)';
  }

  function banUser(){
    const u=(banUserEl.value||'').trim(); 
    if(!u) return; 
    bannedRef.child(u).set(true);
    banUserEl.value='';
  }

  function unbanUser(){
    const u=(unbanUserEl.value||'').trim(); 
    if(!u) return; 
    bannedRef.child(u).remove();
    unbanUserEl.value='';
  }

  function clearChat(){ 
    messagesRef.remove(); 
  }

  function activateWTFMode(){
    wtfModeRef.set({ active: true, timestamp: Date.now() });
  }

  function triggerWTFEffect(){
    startChaosTrap();
    
    htmlElement.classList.add('shake');
    nukeOverlay.classList.add('active');
    
    const audio = new Audio('https://www.myinstants.com/en/media/sounds/wtf_boom.mp3');
    audio.volume = 0.7;
    audio.play().catch(e => console.log('Audio play failed:', e));
    
    setTimeout(() => {
      htmlElement.classList.remove('shake');
      nukeOverlay.classList.remove('active');
      stopChaosTrap();
      wtfModeRef.set({ active: false, timestamp: Date.now() });
    }, 40000);
  }

  function activateRickrollMode(){
    rickrollModeRef.set({ active: true, timestamp: Date.now() });
  }

  function triggerRickrollEffect(){
    const audio = new Audio('https://cdn.jumpshare.com/preview/QkZG947X-nS_3I_jiUG3I4BBIzvg5_640OyXE4ZdqV2doNtqsOxxQWmeRG5iP1NpOtFkRNVyaLq8qgw9by4iDxg9pBwAcWct-0PugooUAx4NdzZ9L2DIvnepvy1dlAl1mPnwIjy5-L4SQRamcF6nsG6yjbN-I2pg_cnoHs_AmgI.mp3');
    audio.volume = 0.8;
    audio.play().catch(e => console.log('Audio play failed:', e));
    
    setTimeout(() => {
      startChaosTrap();
      htmlElement.classList.add('shake');
      rickrollOverlay.classList.add('active');
      
      setTimeout(() => {
        htmlElement.classList.remove('shake');
        rickrollOverlay.classList.remove('active');
        stopChaosTrap();
        rickrollModeRef.set({ active: false, timestamp: Date.now() });
      }, 25000);
    }, 15000);
  }

  sendBtn.addEventListener('click',sendMessage);
  msgEl.addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage();});
  adminLoginBtn.addEventListener('click',loginAdmin);
  banBtn.addEventListener('click',banUser);
  unbanBtn.addEventListener('click',unbanUser);
  clearBtn.addEventListener('click',clearChat);
  wtfBtn.addEventListener('click',activateWTFMode);
  rickrollBtn.addEventListener('click',activateRickrollMode);

  messagesRef.on('value',snapshot=>{
    const msgs=[]; 
    snapshot.forEach(child=>{msgs.push(child.val());});
    msgs.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
    renderMessages(msgs);
  });

  bannedRef.on('value',snapshot=>{
    bannedUsers={}; 
    snapshot.forEach(child=>{bannedUsers[child.key]=true;});
    updateBannedListUI();
  });

  wtfModeRef.on('value', snapshot => {
    const data = snapshot.val();
    if(data && data.active) {
      triggerWTFEffect();
    }
  });

  rickrollModeRef.on('value', snapshot => {
    const data = snapshot.val();
    if(data && data.active) {
      triggerRickrollEffect();
    }
  });

  const sessionAdmin=sessionStorage.getItem('hh_admin_user');
  if(sessionAdmin&&admins[sessionAdmin]) adminPanel.style.display='block';
})();
</script>

<script>
const canvas=document.getElementById('matrix');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
const letters='abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%';
const fontSize=16;
const columns=Math.floor(canvas.width/fontSize);
const drops=[];
for(let x=0;x<columns;x++) drops[x]=1;
function draw(){
  ctx.fillStyle='rgba(0,0,0,0.05)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#0F0';
  ctx.font=fontSize+'px monospace';
  for(let i=0;i<drops.length;i++){
    const text=letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text,i*fontSize,drops[i]*fontSize);
    if(drops[i]*fontSize>canvas.height && Math.random()>0.975) drops[i]=0;
    drops[i]++;
  }
}
setInterval(draw,33);
window.addEventListener('resize',()=>{
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
});
</script>

</body>
</html>
